name: Send approved scheduler audit email

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit data
        uses: actions/checkout@v4

      - name: Build approved audit email
        id: check
        run: node scripts/build-failure-alert.mjs

      - name: Check mail configuration
        id: mail
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          if [ -n "$MAIL_SERVER" ] && [ -n "$MAIL_PORT" ] && [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send approved audit report to Jean
        if: steps.mail.outputs.configured == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          secure: false
          subject: ${{ steps.check.outputs.email_subject }}
          to: jean@Independencedso.com
          from: Scheduler Audit Dashboard <${{ secrets.MAIL_USERNAME }}>
          html_body: file://failure-alert.html

      - name: Stop when mail is not configured
        if: steps.mail.outputs.configured != 'true'
        run: |
          echo "## Email alert was not sent" >> "$GITHUB_STEP_SUMMARY"
          echo "The approved audit report could not be sent because the MAIL_SERVER, MAIL_PORT, MAIL_USERNAME, and MAIL_PASSWORD repository secrets are not configured." >> "$GITHUB_STEP_SUMMARY"
          exit 1
